[project]
name = "down-py"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "selenium>=4.10",
    "webdriver-manager>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["downloader"]

[project.scripts]
downloader = "downloader.cli:main"
